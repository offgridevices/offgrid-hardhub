# HardHub on one computer: `./hardhub` (or `docker compose up --build`).
#
#   web     http://localhost:5173   the app
#   api     http://localhost:8787   Worker + Durable Objects + D1 + R2 (wrangler dev);
#                                   the app reaches it as /api on its own origin
#   engine  http://localhost:8080   KiCad 10 + Freerouting, design -> board
#
# Projects, keys and build outputs live in the named volumes below and
# survive restarts; `./hardhub reset` deletes them.
name: hardhub

services:
  engine:
    build: { context: engine, dockerfile: Dockerfile }
    # this computer only, unless HARDHUB_BIND=0.0.0.0 (see README: other devices)
    ports: ["${HARDHUB_BIND:-127.0.0.1}:8080:8080"]
    # the image's own folders, owned by the engine's user: a new named volume
    # takes that ownership, so the engine can write its jobs and cache
    volumes: [engine-jobs:/var/lib/hardhub/jobs, engine-cache:/var/cache/hardhub]
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request as u,sys; sys.exit(0 if u.build_opener(u.ProxyHandler({})).open('http://127.0.0.1:8080/health', timeout=5).status == 200 else 1)"]
      interval: 10s
      timeout: 8s
      retries: 30
      start_period: 30s
    restart: unless-stopped

  api:
    build: { context: ., dockerfile: apps/api/Dockerfile.dev }
    ports: ["${HARDHUB_BIND:-127.0.0.1}:8787:8787"]
    environment:
      ENGINE_URL: http://engine:8080
      APP_URL: http://localhost:5173
      # optional defaults for new accounts, e.g. a local Ollama:
      #   DEV_LLM_PROVIDER=ollama DEV_LLM_MODEL=qwen3.5:0.8b
      DEV_LLM_PROVIDER: ${DEV_LLM_PROVIDER:-}
      DEV_LLM_MODEL: ${DEV_LLM_MODEL:-}
      DEV_LLM_BASE_URL: ${DEV_LLM_BASE_URL:-}
      DEV_LLM_KEY: ${DEV_LLM_KEY:-}
      ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL:-}
      # your own Claude Code on this computer (./hardhub starts the bridge when it finds it)
      BRIDGE_URL: ${HARDHUB_BRIDGE_URL:-}
      BRIDGE_TOKEN: ${HARDHUB_BRIDGE_TOKEN:-}
    extra_hosts: ["host.docker.internal:host-gateway"]
    volumes: [api-state:/data]
    depends_on:
      engine: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 20s
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args: { VITE_API_URL: /api }
    ports: ["${HARDHUB_BIND:-127.0.0.1}:5173:5173"]
    environment:
      # one origin, as on Cloudflare: the web server forwards /api to the API
      API_PROXY: http://api:8787
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5173/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

volumes:
  engine-jobs:
  engine-cache:
  api-state:
