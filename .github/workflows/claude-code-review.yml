name: Claude Code Review

# Every pull request goes through two stages, in this order:
#
#   1. `ci`     — the full suite from ci.yml (types, unit tests, migrations on
#                 D1, the web build, the engine's tests with real KiCad, and the
#                 end-to-end test with screenshots), called as a reusable workflow.
#   2. `review` — Claude reads the diff, the codebase and the CI output, runs
#                 checks and throwaway tests of its own in a sandbox (this
#                 runner, with Node, pnpm and Docker), and leaves line-by-line
#                 comments and a verdict.
#
# `review` has `needs: ci`, so a red suite stops the pull request at stage 1 and
# no paid review runs. Fix it, push, and both stages run again on the new commit.
# Merging to main then deploys on its own (ci.yml's `deploy` job).
#
# `pull_request` (not `workflow_run`) means GitHub loads this file from the PR
# head, so fixes on the branch take effect without a merge to main. Fork PRs
# still get CI but no review: the review job holds `id-token: write` and runs
# the PR's own code.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]

# One run at a time per pull request; a new push cancels the run in progress.
concurrency:
  group: claude-pr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  review:
    needs: ci
    # Drafts get CI but no review until marked ready (`ready_for_review` re-runs
    # both stages). Dependabot and fork PRs never get the paid review. **This
    # repository is public**: the fork guard is what keeps a stranger's pull
    # request from running a paid review with a token in scope. Do not widen it.
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository
    # 2 vCPU for the free-plan allowance; see the note in ci.yml.
    runs-on: blacksmith-2vcpu-ubuntu-2404

    # Room for the review to run the end-to-end test itself (about 15 minutes
    # with a warm cache) and still write up; a backstop against a hung run.
    timeout-minutes: 50

    permissions:
      contents: read
      pull-requests: write
      # Lets Claude read CI results (checks, run logs) on the PR.
      actions: read
      # **Required, and not an over-broad grant.** The action mints its GitHub
      # token by exchanging an OIDC token, so without this it fails before it
      # reads a single line: "Could not fetch an OIDC token".
      id-token: write

    steps:
      # Pinned to a commit: a tag is mutable, and whoever controls it controls
      # what runs here with a token in scope. `ref` pins the review to the head
      # commit this run was started for (CI tested it merged with main), even
      # if the branch moves on meanwhile.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          # Full history, so `git log` and `git blame` work: the review is
          # better when it can see why a line came to be.
          fetch-depth: 0
          # This job holds `id-token: write` throughout, so the install and the
          # PR's own tests run with it live. Not persisting the checkout's token
          # into `.git/config` leaves them one credential fewer to steal.
          persist-credentials: false

      # ---- Refuse to look reviewed when we cannot review ----------------------
      # GitHub will not let a pull request run a modified copy of the workflow
      # that holds the review's secret (otherwise any PR could rewrite this file
      # to print it). The action honours that by skipping quietly: it exits 0
      # having posted nothing, and the PR looks reviewed when nothing read it.
      # Catch that here, before any minutes go on a review that cannot run, and
      # say so on the PR and in a red check. (From offgridevices/docket.)
      - name: Can the reviewer actually run on this PR?
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          PR: ${{ github.event.pull_request.number }}
          SELF: .github/workflows/claude-code-review.yml
        run: |
          set -uo pipefail
          # Three outcomes, not two: "the API did not answer" is not "the file
          # differs" and must not be reported as if it were.
          state=""
          for _ in 1 2 3; do
            if err=$(gh api "repos/$REPO/contents/$SELF?ref=$DEFAULT_BRANCH" \
                       -H "Accept: application/vnd.github.raw" \
                       2>&1 >/tmp/default-branch-copy.yml); then
              state=fetched; break
            fi
            # A 404 is a real answer: not on the default branch yet (the PR that
            # adds it), which counts as differing.
            case "$err" in *"Not Found"*|*"404"*) state=absent; break ;; esac
            sleep 5
          done
          if [ -z "$state" ]; then
            echo "::error::Could not read $SELF from $DEFAULT_BRANCH after three attempts, so whether the reviewer can run here is unknown. Failing rather than guessing. Re-run this job."
            exit 1
          fi
          if [ "$state" = fetched ] && diff -q /tmp/default-branch-copy.yml "$SELF" >/dev/null 2>&1; then
            echo "This workflow matches $DEFAULT_BRANCH. The reviewer can run."
            exit 0
          fi
          # One comment per pull request, not one per push.
          marker="<!-- reviewer-disabled-workflow-drift -->"
          if ! gh api "repos/$REPO/issues/$PR/comments" --jq '.[].body' 2>/dev/null \
               | grep -qF "$marker"; then
            gh pr comment "$PR" --repo "$REPO" --body "$marker
          **The automated reviewer cannot run on this pull request, so nothing here has been machine-reviewed.**

          This branch changes \`$SELF\`, and GitHub refuses to run a workflow holding repository secrets from a version that does not match \`$DEFAULT_BRANCH\`. Without that rule a pull request could rewrite this file to leak the token. The reviewer is not broken; this is the security boundary working.

          - This pull request needs a **human review**. The red \`review\` check is that request, not a defect in the code. CI above still ran in full.
          - Once it merges, \`$DEFAULT_BRANCH\` carries the new workflow and every later pull request is reviewed normally again.
          - To get the reviewer's eyes on other changes, keep workflow edits in their own pull request." || true
          fi
          echo "::error::Reviewer skipped: $SELF differs from $DEFAULT_BRANCH, so the Claude action will refuse to run. This PR needs a human review; see the comment on it."
          exit 1

      # The same toolchain as ci.yml, so Claude can check a claim about this
      # exact commit itself (`pnpm -r test`, one test file, the engine's tests,
      # the end-to-end test) rather than only trusting its read of the diff.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          check-latest: true
          cache: pnpm

      # `--ignore-scripts`: this installs what the PR's lockfile pins, which the
      # PR author controls. Without it a dependency's install hook runs
      # arbitrary code in a job holding `id-token: write` and
      # `pull-requests: write`. It does not defend against the PR's own code
      # (running that is the point), only its dependencies' install hooks.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      # Docker with the shared layer cache, for the engine's tests and the
      # end-to-end test (both build the KiCad engine image).
      - uses: useblacksmith/setup-docker-builder@19215110ab936351210feebdfa5b440b4493e184 # v2.2.0
        with:
          cache-key: offgrid-hardhub/engine

      # Count the reviewer's finished reviews on this PR so far (summary
      # comments with a Verdict line), so the step after the action can tell
      # "reviewed" from "never ran".
      - name: Count the reviewer's verdicts before it runs
        id: before
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -uo pipefail
          # Fails if the API call does, so a broken API is never counted as 0.
          count_reviews() {
            local ids
            ids=$(gh api --paginate "repos/$REPO/issues/$PR/comments" \
              --jq '.[] | select(.user.login == "claude[bot]" and (.body | contains("**Verdict:**"))) | .id') || return 1
            printf '%s\n' "$ids" | grep -c . || true
          }
          if ! n=$(count_reviews); then
            echo "::error::Could not count the reviewer's earlier verdicts, so there is no baseline to judge this run against. Re-run this job."
            exit 1
          fi
          echo "count=$n" >> "$GITHUB_OUTPUT"
          echo "Reviews with a verdict before this run: $n"

      # Claude's own `gh` runs on the Claude app's token, which cannot read
      # check results ("Resource not accessible by integration"). This reads
      # them with this job's token and leaves them in `.ci-results/` for Claude.
      # Untracked, never committed.
      - name: Collect CI results for Claude
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          # The `ci` job ran earlier in this same workflow run.
          RUN_ID: ${{ github.run_id }}
        run: |
          mkdir -p .ci-results
          echo "# CI results (run $RUN_ID)" > .ci-results/summary.md
          echo >> .ci-results/summary.md
          gh api "repos/$REPO/actions/runs/$RUN_ID/jobs" \
            --jq '.jobs[] | select(.name | startswith("ci /")) | [.id, .name, .conclusion // .status] | @tsv' |
          while IFS=$'\t' read -r id name result; do
            file=".ci-results/$(printf '%s' "$name" | tr -c 'A-Za-z0-9._-' '_').log"
            # Job logs come back as a redirect to a blob; curl follows it. The
            # sed strips timestamps and terminal colour codes.
            curl -fsSL -H "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/$REPO/actions/jobs/$id/logs" |
              sed -E 's/^[0-9T:.-]+Z //; s/\x1b\[[0-9;]*m//g' > "$file" ||
              echo "(log not available)" > "$file"
            echo "- **$name**: $result. Full log: \`$file\`" >> .ci-results/summary.md
          done
          cat .ci-results/summary.md

      # The screenshots CI's end-to-end test took of this build: every screen at
      # phone, tablet and desktop, light and dark.
      - name: Fetch CI's screenshots
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: e2e-shots
          path: .ci-results/shots

      - name: Allow Claude action to fetch the PR branch
        run: git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
        env:
          GITHUB_TOKEN: ${{ github.token }}

      # `anthropics/claude-code-action` v1.0.264, pinned to a commit for the
      # same reason as checkout. Re-resolve the tag and update this line (and
      # the comment) deliberately when picking up a new version; Dependabot
      # proposes it.
      - uses: anthropics/claude-code-action@d70510b174a1244958df0b03166a54912811f3e6 # v1.0.264
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # No `track_progress`: its checklist comment is posted before Claude
          # starts, so a run that then failed (expired token, used-up limit)
          # would still look like a review to the check at the end of this job.

          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request for correctness, security, and obvious
            bugs.

            **What HardHub is.** A web app where someone describes a circuit
            board in plain words and an AI designs it with them: it picks
            parts, checks the circuit, then a KiCad engine lays out, routes and
            checks the board and makes the files a fab (JLCPCB, PCBWay) needs.
            `apps/web` is the React app (Vite, shadcn/ui, Tailwind v4).
            `apps/api` is a Cloudflare Worker (Hono, D1, R2, Durable Objects)
            that also serves the web app and an MCP server for Claude and
            ChatGPT. `engine/` is Python driving KiCad, run as a Cloudflare
            Container. `packages/protocol` holds the types both sides share.
            `e2e/` is the end-to-end test. It is live at
            hardhub.offgridevices.com, and **merging to main deploys it**:
            database migrations first, then the Worker, web app and engine.

            **The full CI suite already passed on this exact commit**; this
            review only starts when it is green. Green means the existing tests
            pass, not that the change is right. Read `.ci-results/summary.md`
            and, where useful, the per-job logs beside it before you comment.

            **Check the pull request's description against the diff.** Every
            change should be something the description asks for, and
            everything it claims should be in the diff. Unrelated changes
            riding along, or a claimed fix that isn't there, are findings.

            **You have a sandbox: use it to test, not just read.** This runner
            is a throwaway checkout of this commit with Node, pnpm, the
            dependencies and Docker. You can run:
            - `pnpm -r typecheck`, `pnpm -r test`, or one package's tests with
              `pnpm --filter @hardhub/web test` / `@hardhub/api` / `@hardhub/protocol`
            - one test file with `pnpm --filter @hardhub/web exec vitest run <path>`
              (or `@hardhub/api`)
            - the web build with `pnpm --filter @hardhub/web build`
            - the migrations on D1 with
              `pnpm --filter @hardhub/api exec wrangler d1 migrations apply hardhub --local`
            - the engine's tests in its image, with real KiCad:
              `./scripts/engine-tests.sh`, or one file with
              `./scripts/engine-tests.sh tests/<file>.py` (it rebuilds the
              image first, so a new test file is included; a few minutes)
            - the whole end-to-end test with `./hardhub test`: the stack in
              Docker, a browser, a board designed, built in KiCad, edited by
              hand, checked and ordered, every screen at phone, tablet and
              desktop. About 15 minutes; its screenshots land in `e2e/out/`.
            You can write new, throwaway tests (Write/Edit): a vitest file next
            to the code under `apps/*/test/`, or a pytest file under
            `engine/tests/`, to probe what this change should handle (empty
            input, boundaries, a bottom-side part, a 4-layer board, a missing
            file, a phone screen) and run them. Nothing you write is committed
            or pushed; it disappears with the runner. When a probe finds a real
            problem, put the failing input and the output in your comment, and
            say which of your claims you verified by running something rather
            than by reading.

            **Look at the screens.** CI's end-to-end test saved screenshots of
            this build in `.ci-results/shots/` (names say the screen, size and
            theme, e.g. `size-phone-dark-circuit.png`). Open the ones this
            change touches with Read: the change should be visible where the
            description says, and nothing else should have moved. The test
            already fails any screen that scrolls sideways or logs an error, so
            spend your eyes on what a test cannot judge: whether it looks right,
            reads simply, and fits the rest of the app.

            **Read the codebase, not just the diff.** The whole repository is
            checked out. Look at what else calls a changed function, whether a
            test already covers the case, and whether the change contradicts a
            decision already written down, before you comment.

            Read for context:
            - `README.md`: what HardHub is, how it runs, deploy and removal.
            - `docs/PLAN.md` and `docs/STATUS.md`: the design and what has been
              verified; a change that breaks a decision recorded there is a
              finding unless the PR updates it.
            - `docs/ci.md` and `.github/workflows/ci.yml`: what has to pass
              before anything reaches production, and how it deploys.
            - `engine/README.md`: the engine's API and pinned tool versions.
            - `e2e/` and the unit tests: the conventions, and whether this
              change is covered.

            Things this repository cares about, in rough priority order:

            1. **Nothing that breaks the live site on merge.** Merging deploys
               by itself. A database migration in `apps/api/migrations/` runs
               before the new code and is *not* undone by a rollback, so it
               must keep the version before it working: adding tables and
               columns is fine; renaming or dropping something the current code
               reads, or a NOT NULL column without a default, is a finding. A
               change to `wrangler.jsonc` (bindings, Durable Object migrations,
               the container) needs the same care.
            2. **Security.** Sign-in is email and password; people's AI keys
               are stored encrypted; MCP clients sign in with OAuth. Check
               authorisation on every new route (can one account read or change
               another's project?), input validation, secrets in tracked files,
               and anything that could leak a key or token into logs, errors or
               the browser.
            3. **US only.** AI model providers must have their servers in the
               USA, and stored data stays in the US (D1 and R2 in the US
               jurisdiction, Durable Objects created in the US). A new model,
               provider or storage location that does not hold to that is a
               finding.
            4. **The boards it makes must be right.** Changes to the engine,
               the design rules, the checks or the fab files can produce a board
               that is wrong in a way no screen shows: a footprint rotated the
               wrong way, a bottom-side part mirrored twice, a net left
               unconnected, a file the fab rejects. Prefer findings you can show
               with an input, and use the engine's tests to show them.
            5. **Correctness under real input.** Prefer "given this input, this
               goes wrong" over matters of taste.
            6. **Plain, simple UI for people who know a little electronics.**
               Screens built from the shadcn components in
               `apps/web/src/components/ui/`, colours from the tokens in
               `apps/web/src/styles/globals.css` (no new hard-coded colours),
               working at phone width, in light and dark, by keyboard.
            7. **Documentation matching the code.** A comment or document that
               describes behaviour the code no longer has is a defect here.

            **This pull request may be very large.** If you cannot cover all
            of it, that is expected, but never finish having posted nothing.
            Budget your turns: skim the file list first, spend your attention
            on source files and config, and treat `pnpm-lock.yaml` and
            generated files as noise. Then post what you found, and say plainly
            in the summary which parts you did not reach.

            If a tool you need is not available to you, say so in the summary
            naming the tool, rather than abandoning the review.

            Leave inline comments on the specific lines that need attention.
            Anchor each to the line it is about, say what goes wrong and under
            what input, and prefer one well-evidenced comment to five
            speculative ones. If you looked at something and it is fine, do not
            comment on it.

            Finish with a brief top-level summary (post it with `gh pr comment`):
            whether the change does what the description says, the findings
            that must be fixed before merge, and anything you verified yourself
            by running a command or a probe test rather than by reading.

            **End the summary with exactly one line for the owner**, the very
            last line of the comment, so he can read only that. Plain words, no
            jargon, under about 40 words, in this form:

            `**Verdict:** ✅ Ready to merge. Tested: <what you ran or looked at>. Next: <the one thing to do, e.g. merge>.`
            `**Verdict:** ⚠️ Merge after one check. Tested: <…>. Not tested: <…>. Next: <the one human check>.`
            `**Verdict:** ❌ Not ready. <n> fixes needed (above). Tested: <…>. Next: <the first fix>.`

            Pick ✅ only if nothing must be fixed and you were able to test what
            the change affects; if you could not test something that matters,
            it is ⚠️ and says what. Never leave the line out, even when the
            review is cut short.

          # `--allowedTools`, camelCase, per the action's own examples. The
          # kebab-case spelling is silently not the flag it parses.
          #
          # Read-only on the repository, plus a fixed set of test and build
          # commands and Write/Edit for throwaway probe tests in this checkout.
          # No git commit or push is in the list, and the job token is
          # read-only on contents. Be clear about the limit, though: a test
          # Claude writes and then runs is code, and it runs in this job with
          # the tokens in its environment. So this list is a guard against
          # mistakes, not a sandbox against a prompt injection; what stops a
          # bad push reaching production is the ruleset on main (a pull request
          # and green checks required, docs/ci.md). `vitest run:*` and
          # `engine-tests.sh:*` take a test path. No wildcard `pnpm <script>:*`.
          #
          # Also absent: `find`, `sed`, `cat`, `docker` and `gh api`. `find
          # -exec` runs arbitrary commands, `sed -i` writes files, `docker run`
          # is a shell, and `gh api` takes POST and DELETE. `Read`, `Grep` and
          # `Glob` already do everything those would be there for.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh run view:*),Bash(pnpm -r typecheck),Bash(pnpm -r test),Bash(pnpm --filter @hardhub/web test),Bash(pnpm --filter @hardhub/api test),Bash(pnpm --filter @hardhub/protocol test),Bash(pnpm --filter @hardhub/web exec vitest run:*),Bash(pnpm --filter @hardhub/api exec vitest run:*),Bash(pnpm --filter @hardhub/web build),Bash(pnpm --filter @hardhub/api exec wrangler d1 migrations apply hardhub --local),Bash(./scripts/engine-tests.sh),Bash(./scripts/engine-tests.sh:*),Bash(./hardhub test),Read,Write,Edit,Grep,Glob,Bash(ls:*),Bash(wc:*),Bash(head:*),Bash(tail:*),Bash(git log:*),Bash(git diff:*),Bash(git show:*),Bash(git blame:*),Bash(git ls-files:*),Bash(git status:*)"
            --max-turns 120
            --model claude-opus-5-5
            --effort medium

      # ---- A green check must mean a reviewer read this -----------------------
      # The action exits 0 whatever happens, including when it does nothing: a
      # skip, an expired token, a used-up limit and a clean review look the same
      # from outside. The prompt requires a summary ending in a Verdict line
      # even when the diff is clean, so no new one means the reviewer failed:
      # go red.
      # No `if: always()`: if an earlier step failed, the baseline is unset and
      # this would credit comments an earlier run left.
      - name: Did the reviewer actually say anything?
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          BEFORE: ${{ steps.before.outputs.count }}
        run: |
          set -uo pipefail
          # Fails if the API call does, so a broken API is never counted as 0.
          count_reviews() {
            local ids
            ids=$(gh api --paginate "repos/$REPO/issues/$PR/comments" \
              --jq '.[] | select(.user.login == "claude[bot]" and (.body | contains("**Verdict:**"))) | .id') || return 1
            printf '%s\n' "$ids" | grep -c . || true
          }
          if ! after=$(count_reviews); then
            echo "::error::Could not count the reviewer's comments after the run, so whether it posted anything is unknown. Re-run this job."
            exit 1
          fi
          echo "Reviews with a verdict: ${BEFORE:-0} before, $after after."
          if [ "$after" -gt "${BEFORE:-0}" ]; then
            echo "The reviewer posted its verdict. Green means reviewed."
            exit 0
          fi
          echo "::error::The reviewer ran but posted no summary with a verdict, so this pull request has NOT been reviewed. Check the Claude step's log: a workflow-validation skip, an expired CLAUDE_CODE_OAUTH_TOKEN and a used-up limit all look like this."
          exit 1
