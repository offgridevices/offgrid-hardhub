name: Claude Mention

# Reply when someone writes @claude in a pull request: in the conversation, on
# a specific line of the diff, or in a review summary. This is the
# conversational half of the setup; `claude-code-review.yml` is the automatic
# first pass that runs without being asked.
#
# Use it to argue with a review comment, ask why something is a finding, or ask
# Claude to test something in its sandbox. It answers in the same thread.

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

jobs:
  # Everything that decides *whether* to respond, kept apart from the job that
  # spends money doing it and holds `id-token: write`. A job-level `if:` can't
  # run `gh`, so "is this PR's head in this repository" is resolved in a step
  # and handed to the next job as an output.
  gate:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 5

    # Three gates, all of which have to hold:
    #
    #  - The comment actually says @claude. Every comment on every pull request
    #    starts this workflow; without this every one would start a paid run.
    #  - It is on a pull request, not a plain issue: there is no diff on an issue.
    #  - The author can write to this repository. **This repository is
    #    public**, so this is the gate that keeps a stranger's comment from
    #    starting a paid run on the org's account. Do not widen it.
    if: >-
      (
        (github.event_name == 'issue_comment' &&
         github.event.issue.pull_request != null &&
         contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review_comment' &&
         contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review' &&
         contains(github.event.review.body, '@claude'))
      ) &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'),
               github.event.comment.author_association ||
               github.event.review.author_association)

    permissions:
      pull-requests: read

    outputs:
      should_run: ${{ steps.pr.outputs.should_run }}
      pr_number: ${{ steps.pr.outputs.number }}
      head_sha: ${{ steps.pr.outputs.sha }}

    steps:
      # `issue_comment` carries no pull-request SHA (GITHUB_SHA is the default
      # branch's tip), so resolve the PR's head here for all three triggers. It
      # also checks the head is in this repository: the `respond` job runs the
      # PR's own code with `id-token: write` live, and a fork's PR is exactly
      # the case that is dangerous for. Every value comes from the API, not
      # from comment text.
      - name: Resolve PR head and check it isn't a fork
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
        run: |
          echo "number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          INFO=$(gh pr view "$PR_NUMBER" --repo "${{ github.repository }}" --json headRefOid,isCrossRepository)
          echo "sha=$(echo "$INFO" | jq -r .headRefOid)" >> "$GITHUB_OUTPUT"
          if [ "$(echo "$INFO" | jq -r .isCrossRepository)" = "true" ]; then
            echo "Pull request head is in a different repository (fork); skipping."
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          fi

  respond:
    needs: gate
    if: needs.gate.outputs.should_run == 'true'
    # One reply at a time per pull request, on this job and not the workflow:
    # every comment starts this workflow (Claude's own replies included), and
    # GitHub keeps only the newest waiting run in a group, so a workflow-level
    # group would let any later comment drop a waiting @claude request.
    concurrency:
      group: claude-mention-${{ needs.gate.outputs.pr_number }}
      cancel-in-progress: false
    runs-on: blacksmith-2vcpu-ubuntu-2404
    # Room for one run of the end-to-end test if it is asked for.
    timeout-minutes: 40

    permissions:
      contents: read
      pull-requests: write
      issues: write
      actions: read
      # Required: the action mints its GitHub token by exchanging an OIDC
      # token. Without this it fails before reading a line.
      id-token: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.gate.outputs.head_sha }}
          fetch-depth: 0
          # See claude-code-review.yml: the PR's own code may run in this job,
          # so the checkout's token is not left in `.git/config`.
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          check-latest: true
          cache: pnpm

      # `--ignore-scripts`: see claude-code-review.yml.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - uses: useblacksmith/setup-docker-builder@19215110ab936351210feebdfa5b440b4493e184 # v2.2.0
        with:
          cache-key: offgrid-hardhub/engine

      # Claude's own `gh` cannot read check results; this reads them with this
      # job's token into `.ci-results/`. Untracked, never committed.
      - name: Collect CI results for Claude
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ needs.gate.outputs.head_sha }}
        run: |
          # CI for a pull request runs inside claude-code-review.yml; take its
          # latest run on this exact commit.
          RUN_ID=$(gh api "repos/$REPO/actions/workflows/claude-code-review.yml/runs?head_sha=$HEAD_SHA&per_page=1" \
            --jq '.workflow_runs[0].id // empty')
          mkdir -p .ci-results
          : > .ci-results/summary.md
          if [ -z "$RUN_ID" ]; then
            echo "No CI run was found for this commit." >> .ci-results/summary.md
            exit 0
          fi
          echo "# CI results (run $RUN_ID)" >> .ci-results/summary.md
          echo >> .ci-results/summary.md
          gh api "repos/$REPO/actions/runs/$RUN_ID/jobs" \
            --jq '.jobs[] | select(.name | startswith("ci /")) | [.id, .name, .conclusion // .status] | @tsv' |
          while IFS=$'\t' read -r id name result; do
            file=".ci-results/$(printf '%s' "$name" | tr -c 'A-Za-z0-9._-' '_').log"
            curl -fsSL -H "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/$REPO/actions/jobs/$id/logs" |
              sed -E 's/^[0-9T:.-]+Z //; s/\x1b\[[0-9;]*m//g' > "$file" ||
              echo "(log not available)" > "$file"
            echo "- **$name**: $result. Full log: \`$file\`" >> .ci-results/summary.md
          done
          cat .ci-results/summary.md

      - name: Allow Claude action to fetch the PR branch
        run: git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
        env:
          GITHUB_TOKEN: ${{ github.token }}

      # `anthropics/claude-code-action` v1.0.264, pinned for the same reason.
      - uses: anthropics/claude-code-action@d70510b174a1244958df0b03166a54912811f3e6 # v1.0.264
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ needs.gate.outputs.pr_number }}

            Someone mentioned you in a comment on this pull request. Read the
            comment that triggered this run, answer it, and reply in the same
            thread.

            HardHub turns a plain-words description into a circuit board:
            `apps/web` (React), `apps/api` (a Cloudflare Worker that also serves
            the web app and an MCP server), `engine/` (Python driving KiCad, a
            Cloudflare Container), `e2e/` (the end-to-end test). Merging to main
            deploys it. Read `README.md` and `docs/ci.md` first.

            **Read the codebase, not just the diff.** The whole repository is
            checked out at this pull request's head commit. Before answering a
            question about a line, look at what calls it, whether a test already
            covers it, and whether a decision about it is written down.

            **Verify instead of guessing, when you can check cheaply.** CI's
            results for this commit are in `.ci-results/`: `summary.md` plus the
            full log of each job. You can run `pnpm -r typecheck`,
            `pnpm -r test`, one test file with
            `pnpm --filter @hardhub/web exec vitest run <path>` (or
            `@hardhub/api`), the engine's tests with real KiCad with
            `./scripts/engine-tests.sh [tests/<file>.py]`, and the whole
            end-to-end test with `./hardhub test` (about 15 minutes; its
            screenshots land in `e2e/out/`).

            **If you are asked to test something, you have a sandbox.** This
            runner is a throwaway checkout: you can write probe tests
            (Write/Edit) and run them with the commands above, then report the
            input and the real output. Nothing you write is committed or pushed.

            How to answer:

            - If you are asked to justify a finding, either defend it with
              evidence (the input that breaks it, the test that disagrees) or
              say plainly that you were wrong. Do not restate the finding more
              confidently as a substitute for evidence.
            - If you are asked whether something is a problem and it is not,
              say so in a sentence and stop.
            - If you are asked to make a change, you cannot land it: edits here
              are never committed. You may make the change locally to prove it
              passes, then reply with the exact change, anchored to the file and
              line, so a human or their agent can apply it.
            - Keep it short. This is a comment thread, not a report.

          # The same allowlist as the review, for the same reasons (see
          # claude-code-review.yml): read-only on the repository, a fixed set of
          # test commands, Write/Edit for throwaway probes, and no `find`,
          # `sed`, `cat`, `docker` or `gh api`.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh run view:*),Bash(pnpm -r typecheck),Bash(pnpm -r test),Bash(pnpm --filter @hardhub/web test),Bash(pnpm --filter @hardhub/api test),Bash(pnpm --filter @hardhub/protocol test),Bash(pnpm --filter @hardhub/web exec vitest run:*),Bash(pnpm --filter @hardhub/api exec vitest run:*),Bash(pnpm --filter @hardhub/web build),Bash(./scripts/engine-tests.sh),Bash(./scripts/engine-tests.sh:*),Bash(./hardhub test),Read,Write,Edit,Grep,Glob,Bash(ls:*),Bash(wc:*),Bash(head:*),Bash(tail:*),Bash(git log:*),Bash(git diff:*),Bash(git show:*),Bash(git blame:*),Bash(git ls-files:*),Bash(git status:*)"
            --max-turns 60
            --model claude-opus-5-5
            --effort medium
